[workspace]
resolver = "2"
members = ["crates/billhub-core", "crates/billhub-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
billhub-core = { path = "crates/billhub-core" }
anyhow = "1"
calamine = "0.36"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
encoding_rs = "0.8"
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5"] }
